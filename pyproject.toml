[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 79
target-version = "py313"
extend-exclude = [".venv", "frontend", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E203", # espacio antes de ':' en slices multilínea
    "E231", # espacio tras la coma dentro de f-strings
]

[tool.ruff.lint.per-file-ignores]
# Los fixtures de test usan nombres largos en varias líneas.
"backend/tests/*" = ["E501"]